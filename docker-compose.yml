services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment: #переменные окружения для инициализации БД
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432" #проброс порта хост:контейнер
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: #загрузка переменных из корневого .env
      - .env
    networks:
      - microservices_network
    healthcheck: # проверка готовности БД к приёму соединений
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build: ./auth_service #сборка из Dockerfile в папке auth_serv
    container_name: auth_service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./auth_service/.env
    networks:
      - microservices_network

  task_service:
    build: ./task_service
    container_name: task_service
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
    env_file:
      - ./task_service/.env
    networks:
      - microservices_network

volumes:
  postgres_data:

networks:
  microservices_network:
    driver: bridge