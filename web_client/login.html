<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Task Manager</title>
    <link rel="stylesheet" href="style.css">
    
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>🔐 Вход в систему</h1>
            
            <div class="form-group">
                <label>📧 Email:</label>
                <input type="email" id="email" placeholder="example@mail.com">
            </div>
            
            <div class="form-group">
                <label>🔒 Пароль:</label>
                <input type="password" id="password" placeholder="••••••">
            </div>
            
            <button onclick="login()">Войти</button>
            
            <p class="link">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
            
            <div id="message"></div>
        </div>
    </div>

    <script>
        //если пользователь уже авторизован, отправляем его сразу в задачи
        async function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:8001/verify', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (data.valid) {
                        window.location.replace('tasks.html');
                    }
                } catch (e) {
                    //ошибка - значит токен невалидный
                    localStorage.clear();
                }
            }
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8001/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    //сохраняем данные
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('avatar', data.avatar || '');
                    
                    showMessage('Успешный вход!', 'success');
                    
                    //используем replace вместо href
                    setTimeout(() => {
                        window.location.replace('tasks.html');
                    }, 1000);
                } else {
                    showMessage(data.detail || 'Неверные данные', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('❌ Ошибка подключения к серверу', 'error');
            }
        }
        
        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = type;
            setTimeout(() => {
                msgDiv.textContent = '';
                msgDiv.className = '';
            }, 3000);
        }
        
        //проверяем при загрузке страницы
        checkAlreadyLoggedIn();
        
        //защита от возврата на страницу логина после выхода
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                checkAlreadyLoggedIn();
            }
        });
    </script>
</body>
</html>
