<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля - Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        .settings-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
        }
        
        body.dark-mode .settings-section {
            background: #2a2a3e;
        }
        
        .settings-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        body.dark-mode .settings-section h3 {
            color: #eee;
        }
        
        .settings-btn {
            width: auto;
            padding: 10px 20px;
            background: #667eea;
            margin-top: 5px;
        }
        
        .settings-message {
            margin-top: 10px;
            font-size: 14px;
        }
        
        .settings-message.success {
            color: #4caf50;
        }
        
        .settings-message.error {
            color: #f44336;
        }
        
        .danger-section {
            border: 2px solid #ff4444;
            background: #fff5f5;
        }
        
        body.dark-mode .danger-section {
            background: #3a1a1a;
            border-color: #ff4444;
        }
        
        .delete-account-btn {
            width: auto;
            padding: 10px 20px;
            background: #f44336;
        }
        
        .delete-account-btn:hover {
            background: #d32f2f;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .settings-message {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            display: block !important;
        }

        .settings-message.success {
            background-color: #4caf50 !important;
            color: white !important;
        }

        .settings-message.error {
            background-color: #f44336 !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container" style="max-width: 500px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>⚙️ Настройки профиля</h1>
                <a href="tasks.html" style="color: #667eea;">← Назад к задачам</a>
            </div>
            
            <!-- Информация о пользователе -->
            <div style="text-align: center; margin-bottom: 30px;">
                <img id="profileAvatar" class="avatar" src="" alt="avatar">
                <h3 id="profileUsername"></h3>
                <p id="profileEmail" style="color: #666;"></p>
            </div>
            
            <!-- Смена email -->
            <div class="settings-section">
                <h3>📧 Смена email</h3>
                <div class="form-group">
                    <input type="email" id="newEmail" placeholder="Новый email">
                </div>
                <button onclick="changeEmail()" class="settings-btn">Обновить email</button>
                <div id="emailMessage" class="settings-message"></div>
            </div>
            
            <!-- Смена никнейма -->
            <div class="settings-section">
                <h3>👤 Смена никнейма</h3>
                <div class="form-group">
                    <input type="text" id="newUsername" placeholder="Новый никнейм">
                </div>
                <button onclick="changeUsername()" class="settings-btn">Обновить никнейм</button>
                <div id="usernameMessage" class="settings-message"></div>
            </div>
            
            <!-- Смена пароля -->
            <div class="settings-section">
                <h3>🔒 Смена пароля</h3>
                <div class="form-group">
                    <input type="password" id="currentPassword" placeholder="Текущий пароль">
                </div>
                <div class="form-group">
                    <input type="password" id="newPassword" placeholder="Новый пароль (мин. 6 символов)">
                </div>
                <div class="form-group">
                    <input type="password" id="confirmNewPassword" placeholder="Подтвердите новый пароль">
                </div>
                <button onclick="changePassword()" class="settings-btn">Обновить пароль</button>
                <div id="passwordMessage" class="settings-message"></div>
            </div>
            
            <!-- Удаление аккаунта -->
            <div class="settings-section danger-section">
                <h3>⚠️ ВНИМАНИЕ </h3>
                <p style="font-size: 14px; color: #999; margin-bottom: 15px;">
                    Удаление аккаунта приведет к безвозвратному удалению всех ваших задач.
                </p>
                <div class="form-group">
                    <input type="password" id="deletePassword" placeholder="Введите пароль для подтверждения">
                </div>
                <button onclick="deleteAccount()" class="delete-account-btn">🗑️ Удалить мой аккаунт</button>
                <div id="deleteMessage" class="settings-message"></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.replace('login.html');
        }
              
        async function changeEmail() {
            const newEmail = document.getElementById('newEmail').value;
            const messageDiv = document.getElementById('emailMessage');
            
            if (!newEmail) {
                messageDiv.innerHTML = 'Введите новый email';
                messageDiv.className = 'settings-message error';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8001/change-email', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email: newEmail })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = 'Email успешно обновлен!';
                    messageDiv.className = 'settings-message success';
                    document.getElementById('newEmail').value = '';
                    loadUserInfo();
                    setTimeout(() => {
                        messageDiv.innerHTML = '';
                    }, 3000);
                } else {
                    let errorMessage = 'Ошибка обновления email';
                    if (data.detail) {
                        if (typeof data.detail === 'string') {
                            errorMessage = data.detail;
                        } else if (Array.isArray(data.detail) && data.detail[0]?.msg) {
                            errorMessage = data.detail[0].msg;
                        } else if (data.detail?.msg) {
                            errorMessage = data.detail.msg;
                        }
                    }
                    messageDiv.innerHTML = '❌ ' + errorMessage;
                    messageDiv.className = 'settings-message error';
                }
            } catch (error) {
                messageDiv.innerHTML = '❌ Ошибка подключения к серверу';
                messageDiv.className = 'settings-message error';
            }
        }

        async function changeUsername() {
            const newUsername = document.getElementById('newUsername').value;
            const messageDiv = document.getElementById('usernameMessage');
            
            if (!newUsername || newUsername.length < 3) {
                messageDiv.innerHTML = 'Никнейм должен быть минимум 3 символа';
                messageDiv.className = 'settings-message error';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8001/change-username', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username: newUsername })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('username', newUsername);
                    if (data.access_token) {
                        localStorage.setItem('token', data.access_token);
                    }
                    messageDiv.innerHTML = 'Никнейм успешно обновлен!';
                    messageDiv.className = 'settings-message success';
                    document.getElementById('newUsername').value = '';
                    loadUserInfo();
                    setTimeout(() => {
                        messageDiv.innerHTML = '';
                    }, 3000);
                } else {
                    messageDiv.innerHTML = '❌ ' + (data.detail || 'Ошибка обновления никнейма');
                    messageDiv.className = 'settings-message error';
                }
            } catch (error) {
                messageDiv.innerHTML = '❌ Ошибка подключения к серверу';
                messageDiv.className = 'settings-message error';
            }
        }
        
        async function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const messageDiv = document.getElementById('passwordMessage');
            
            if (!currentPassword || !newPassword || !confirmNewPassword) {
                messageDiv.innerHTML = 'Заполните все поля';
                messageDiv.className = 'settings-message error';
                return;
            }
            
            if (newPassword.length < 6) {
                messageDiv.innerHTML = 'Новый пароль должен быть минимум 6 символов';
                messageDiv.className = 'settings-message error';
                return;
            }
            
            if (newPassword !== confirmNewPassword) {
                messageDiv.innerHTML = 'Новые пароли не совпадают';
                messageDiv.className = 'settings-message error';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8001/change-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = 'Пароль успешно обновлен!';
                    messageDiv.className = 'settings-message success';
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmNewPassword').value = '';
                    setTimeout(() => {
                        messageDiv.innerHTML = '';
                    }, 3000);
                } else {
                    messageDiv.innerHTML = '❌ ' + (data.detail || 'Ошибка обновления пароля');
                    messageDiv.className = 'settings-message error';
                }
            } catch (error) {
                messageDiv.innerHTML = '❌ Ошибка подключения к серверу';
                messageDiv.className = 'settings-message error';
            }
        }
        
        async function deleteAccount() {
            const password = document.getElementById('deletePassword').value;
            const messageDiv = document.getElementById('deleteMessage');
            
            if (!password) {
                messageDiv.innerHTML = '❌ Введите пароль для подтверждения';
                messageDiv.className = 'settings-message error';
                return;
            }
            
            const confirmed = confirm('⚠️ ВНИМАНИЕ! Это действие НЕОБРАТИМО.\n\nВсе ваши задачи будут удалены.\n\nВы уверены, что хотите удалить аккаунт?');
            
            if (!confirmed) return;
            
            try {
                console.log('Sending delete request...');
                const response = await fetch('http://localhost:8001/delete-account', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ password: password })
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    alert('Аккаунт удален. До свидания!');
                    localStorage.clear();
                    sessionStorage.clear();
                    window.location.replace('register.html');
                } else {
                    messageDiv.innerHTML = '❌ ' + (data.detail || 'Неверный пароль или ошибка сервера');
                    messageDiv.className = 'settings-message error';
                    document.getElementById('deletePassword').value = '';
                }
            } catch (error) {
                console.error('Delete error:', error);
                messageDiv.innerHTML = '❌ Ошибка подключения к серверу: ' + error.message;
                messageDiv.className = 'settings-message error';
            }
        }
        
        async function loadUserInfo() {
            const savedUsername = localStorage.getItem('username');
            const savedEmail = localStorage.getItem('email');
            const savedAvatar = localStorage.getItem('avatar');

            if (savedUsername) {
                document.getElementById('profileUsername').innerText = savedUsername;
            }
            if (savedEmail) {
                document.getElementById('profileEmail').innerText = savedEmail;
            }
            if (savedAvatar && savedAvatar !== 'null') {
                document.getElementById('profileAvatar').src = savedAvatar;
            }
            
            try {
                const response = await fetch('http://localhost:8001/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401) {
                    localStorage.clear();
                    window.location.replace('login.html');
                    return;
                }
                
                const user = await response.json();
                document.getElementById('profileUsername').innerText = user.username;
                document.getElementById('profileEmail').innerText = user.email;
                
                // Сохраняем в localStorage
                localStorage.setItem('username', user.username);
                localStorage.setItem('email', user.email);  // ← ДОБАВИТЬ
                
                const avatarImg = document.getElementById('profileAvatar');
                if (user.avatar && user.avatar !== 'null' && user.avatar !== '') {
                    avatarImg.src = user.avatar;
                    localStorage.setItem('avatar', user.avatar);
                } else if (savedAvatar && savedAvatar !== 'null') {
                    avatarImg.src = savedAvatar;
                } else {
                    avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.username)}&background=667eea&color=fff`;
                }
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await loadUserInfo();
        });
    </script>
</body>
</html>
