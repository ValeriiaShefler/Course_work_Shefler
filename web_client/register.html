<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>📝 Регистрация</h1>
            
            <div class="form-group">
                <label>👤 Никнейм:</label>
                <input type="text" id="username" placeholder="ivan123">
            </div>
            
            <div class="form-group">
                <label>📧 Email:</label>
                <input type="email" id="email" placeholder="ivan@example.com">
            </div>
            
            <div class="form-group">
                <label>🔒 Пароль (мин. 6 символов):</label>
                <input type="password" id="password">
            </div>
            
            <div class="form-group">
                <label>🔒 Подтверждение пароля:</label>
                <input type="password" id="confirmPassword">
            </div>
            
            <div class="form-group">
                <label>🖼️ Аватарка:</label>
                <input type="file" id="avatarFile" accept="image/*">
                <div id="avatarPreview"></div>
            </div>
            
            <button onclick="register()">Зарегистрироваться</button>
            
            <p class="link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
            
            <div id="message"></div>
        </div>
    </div>

    <script>
        let avatarBase64 = null;
        
        //проверка, не залогинен ли уже пользователь
        async function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:8001/verify', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (data.valid) {
                        window.location.replace('tasks.html');
                    }
                } catch (e) {
                    localStorage.clear();
                }
            }
        }

        checkAlreadyLoggedIn();

        //предпросмотр аватарки
        document.getElementById('avatarFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    avatarBase64 = event.target.result;
                    const preview = document.getElementById('avatarPreview');
                    preview.innerHTML = `<img src="${avatarBase64}" style="width: 100px; height: 100px; border-radius: 50%; margin-top: 10px;">`;
                };
                reader.readAsDataURL(file);
            }
        });
        
        async function register() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Валидация
            if (!username || !email || !password || !confirmPassword) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Пароли не совпадают', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Пароль должен быть минимум 6 символов', 'error');
                return;
            }
            
            if (username.length < 3) {
                showMessage('Никнейм должен быть минимум 3 символа', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8001/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        avatar: avatarBase64  // отправляем base64 строку
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('avatar', data.avatar || '');
                    showMessage('Регистрация успешна! Перенаправление...', 'success');
                    setTimeout(() => {
                        window.location.href = 'tasks.html';
                    }, 1000);
                } else {
                    showMessage(data.detail || 'Ошибка регистрации', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ Ошибка подключения к серверу. Убедитесь, что Docker запущен.', 'error');
            }
        }
        
        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = type;
            setTimeout(() => {
                msgDiv.textContent = '';
                msgDiv.className = '';
            }, 3000);
        }
    </script>
</body>
</html>
